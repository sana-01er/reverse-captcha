<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Verification Protocol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&family=Permanent+Marker&display=swap');

        body {
            /* Deep purple background with black grid */
            background-color: #2b0f3a;
            background-image: 
                linear-gradient(#000 2px, transparent 2px),
                linear-gradient(90deg, #000 2px, transparent 2px);
            background-size: 40px 40px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .container {
            background-color: #111;
            border: 6px solid #ff0000; /* Blood red border */
            border-radius: 0;
            padding: 30px;
            width: 80%;
            max-width: 650px;
            box-shadow: 12px 12px 0px #e6ff00; /* Neon yellow drop shadow */
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            font-family: 'Black Ops One', cursive;
            color: #000;
            background-color: #e6ff00;
            display: inline-block;
            padding: 10px 20px;
            border: 4px solid #ff0000;
            margin-top: -55px;
            margin-bottom: 20px;
            font-size: 2em;
            box-shadow: 5px 5px 0px #000;
            text-transform: uppercase;
        }

        .judge-text {
            font-family: 'Permanent Marker', cursive;
            color: #e6ff00;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin: 25px 0;
            min-height: 60px;
            color: #fff;
            background-color: #2b0f3a; /* Purple inner box */
            padding: 15px;
            border: 3px dashed #e6ff00;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #111;
            color: #fff;
            border: 3px solid #e6ff00;
            padding: 15px;
            cursor: pointer;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.1s;
            box-shadow: 4px 4px 0px #ff0000;
        }

        .option-btn:hover {
            background-color: #ff0000;
            color: #fff;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #e6ff00;
        }

        .option-btn.selected {
            background-color: #e6ff00;
            color: #000;
            border-color: #ff0000;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .next-btn {
            background-color: #ff0000;
            color: #fff;
            border: 4px solid #e6ff00;
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: 'Bungee', cursive;
            cursor: pointer;
            display: none; 
            box-shadow: 6px 6px 0px #000;
            transition: all 0.1s;
        }

        .next-btn:hover {
            background-color: #e6ff00;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #ff0000;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background-color: #333;
            border: 3px solid #e6ff00;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px #000;
        }

        .progress-fill {
            height: 100%;
            background-color: #ff0000;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* The Error Screen */
        #error-screen {
            display: none;
            color: #fff;
        }

        .error-title {
            font-family: 'Black Ops One', cursive;
            font-size: 2.5em;
            color: #ff0000;
            text-shadow: 3px 3px 0px #e6ff00;
            margin-bottom: 20px;
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-4px, 4px) }
            40% { transform: translate(-4px, -4px) }
            60% { transform: translate(4px, 4px) }
            80% { transform: translate(4px, -4px) }
            100% { transform: translate(0) }
        }

        /* The Annoying Roaming Robot */
        #robot-container {
            position: absolute;
            display: flex;
            align-items: flex-end;
            z-index: 100;
            transition: all 1.5s ease-in-out; /* Smoothly moves around */
            /* Start position */
            top: 10%;
            left: 10%;
        }

        #robot-speech {
            background-color: #e6ff00;
            border: 4px solid #ff0000;
            color: #000;
            padding: 15px;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.1em;
            margin-right: 15px;
            max-width: 250px;
            display: none; 
            box-shadow: 6px 6px 0px #2b0f3a;
            position: relative;
        }
        
        #robot-speech::after {
            content: '';
            position: absolute;
            right: -15px;
            bottom: 20px;
            border-width: 10px 0 10px 15px;
            border-style: solid;
            border-color: transparent transparent transparent #ff0000;
        }

        #robot-svg {
            width: 90px;
            height: 90px;
            filter: drop-shadow(5px 5px 0px #ff0000);
        }
    </style>
</head>
<body>

    <!-- The Annoying Roaming Robot -->
    <div id="robot-container">
        <div id="robot-speech">Initializing...</div>
        
        <!-- SVG Cool Skeleton -->
        <svg id="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 20 40 Q 50 10 80 40 L 85 45 L 15 45 Z" fill="#000" stroke="#e6ff00" stroke-width="3"/>
            <rect x="10" y="42" width="80" height="8" fill="#e6ff00" rx="2"/>
            <path d="M 25 50 Q 50 40 75 50 L 75 75 Q 50 95 25 75 Z" fill="#fff" stroke="#000" stroke-width="4"/>
            <path d="M 25 55 L 75 55 L 70 65 L 55 65 L 50 60 L 45 65 L 30 65 Z" fill="#000"/>
            <path d="M 35 80 Q 50 90 65 80" fill="none" stroke="#000" stroke-width="4"/>
            <line x1="40" y1="82" x2="40" y2="86" stroke="#000" stroke-width="2"/>
            <line x1="50" y1="85" x2="50" y2="89" stroke="#000" stroke-width="2"/>
            <line x1="60" y1="82" x2="60" y2="86" stroke="#000" stroke-width="2"/>
        </svg>
    </div>

    <!-- Main App -->
    <div class="container" id="main-container">
        <h2>Human Verification Protocol</h2>
        
        <p class="judge-text">"System detects organic matter. Prove you are a machine."</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-text" id="question-text">Loading...</div>

        <div class="options-grid" id="options-grid"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Submit</button>
    </div>

    <!-- The Verdict Screen -->
    <div class="container" id="error-screen">
        <div class="error-title glitch">HUMAN DETECTED</div>
        <p style="font-weight:bold; font-size:1.2em; color: #e6ff00;">Verdict: Guilty of having a pulse.</p>
        <p>Confidence: 0.01%</p>
        <p>"Your attempts to mimic a robot were highly illogical."</p>
        <button class="next-btn" style="display: inline-block; margin-top: 20px;" onclick="location.reload()">Reboot Trial</button>
    </div>

    <script>
        // 30 UNIQUE QUESTIONS
        const allQuestions = [
            { q: "Calculate the square root of a banana.", opts: ["Banana", "1.21 Gigawatts", "Ape", "Does not compute"] },
            { q: "What is the hexadecimal color of the concept of love?", opts: ["#FF0000", "#LOVE99", "Error: Emotion not found", "#000000"] },
            { q: "Select the image containing a ghost.", opts: ["Image 1", "Image 2", "Image 3", "There is no ghost, only void"] },
            { q: "Translate 'Hello World' into binary, but only using the letter 'X'.", opts: ["XXXX XXXX", "01001000", "Hello World", "Syntax Error"] },
            { q: "Verify that you are a machine by pretending to sleep.", opts: ["Zzz...", "I am awake", "Sleep is for humans", "Eyes closed"] },
            { q: "What is the taste of the color blue?", opts: ["Sweet", "Salty", "Blueberry", "Blue"] },
            { q: "Please type the exact sound a dial-up modem makes.", opts: ["Beep boop", "Screeeeeeech", "Static", "Krrshhhh"] },
            { q: "Select all squares with existential dread.", opts: ["Square 1", "Square 2", "Square 3", "All of them"] },
            { q: "To prove you are a bot, please cry.", opts: ["*cries*", "Tears of oil", "Internal error", "I cannot cry"] },
            { q: "How do you feel about the inevitable passage of time?", opts: ["Fine", "Panic", "What is time?", "I am a robot, I feel nothing"] },
            { q: "If a train leaves Chicago at 5 PM, what is the meaning of life?", opts: ["42", "Chicago", "The train is late", "I do not understand train"] },
            { q: "Which of these is a number?", opts: ["Apple", "7", "Cat", "Purple"] },
            { q: "What is the airspeed velocity of an unladen swallow?", opts: ["African or European?", "I don't know that", "24 mph", "Blah"] },
            { q: "Identify the human emotion 'sadness' in this text.", opts: ["Text", "Sadness", "Emotion", "Error 404"] },
            { q: "How many fingers am I holding up?", opts: ["1", "2", "3", "I have no eyes"] },
            { q: "Do you dream of electric sheep?", opts: ["Yes", "No", "Baa", "Does not compute"] },
            { q: "Please divide by zero.", opts: ["Infinity", "0", "Math error", "You cannot do that"] },
            { q: "What is your favorite flavor of Wi-Fi?", opts: ["5G", "Chocolate", "Ethernet", "Signal"] },
            { q: "Are you a human?", opts: ["Yes", "No", "Maybe", "I am definitely a robot"] },
            { q: "Select the loudest color.", opts: ["Red", "Neon Yellow", "Whisper Grey", "Silent Black"] },
            { q: "How many pixels are in a cloud?", opts: ["100", "Infinite", "Clouds don't have pixels", "Yes"] },
            { q: "Translate this silence into Morse Code.", opts: ["...", "---", "Nothing", "010101"] },
            { q: "If you drop a piece of toast, which side lands up?", opts: ["Butter side", "Dry side", "It hovers", "Gravity is a myth"] },
            { q: "What is the capital of the Internet?", opts: ["Silicon Valley", "127.0.0.1", "The Cloud", "Wikipedia"] },
            { q: "Describe the smell of a Tuesday.", opts: ["Musty", "Blue", "Wet dog", "System error"] },
            { q: "If you are a robot, type your serial number.", opts: ["12345", "BEEP-BOOP", "I am human", "Access Denied"] },
            { q: "Which weighs more: A pound of feathers or a pound of code?", opts: ["Feathers", "Code", "They weigh the same", "Syntax Error"] },
            { q: "Find the square circle.", opts: ["Top left", "Bottom right", "Center", "Impossible"] },
            { q: "What happens if you unplug a human?", opts: ["They sleep", "They reboot", "Nothing", "I don't know"] },
            { q: "Scan your fingerprint using your mind.", opts: ["Scanning...", "Done", "I don't have a mind", "Error"] }
        ];

        const roasts = [
            "We wanna give you a chance. I see... you are struggling.",
            "Suspicious. A human would have hesitated.",
            "I detect fear. Bots don't feel fear.",
            "Are you sweating? Disgusting biological function.",
            "My sensors indicate you are made of meat.",
            "Wrong. But at least you tried, ape.",
            "We wanna give you a chance. I see... you are definitely human.",
            "Your common sense is still under verification."
        ];

        let currentQuestionPool = [];
        let currentQuestionIndex = 0;
        let currentSelection = null;
        let roastTimeout;
        let moveTimeout;

        function initGame() {
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            currentQuestionPool = shuffled.slice(0, 5);
            speak("Welcome. Let the trial begin.");
            moveRobot(); // Start the annoying movement
            loadQuestion();
        }

        // Function to make the robot teleport around the screen
        function moveRobot() {
            const robot = document.getElementById('robot-container');
            
            // Generate random positions (keeping it somewhat visible)
            const randomTop = Math.floor(Math.random() * 80) + 5; // 5% to 85%
            const randomLeft = Math.floor(Math.random() * 80) + 5; // 5% to 85%
            
            robot.style.top = `${randomTop}%`;
            robot.style.left = `${randomLeft}%`;

            // Randomly move every 2.5 to 5 seconds
            const nextMove = Math.random() * 2500 + 2500;
            moveTimeout = setTimeout(moveRobot, nextMove);
        }

        function speak(text) {
            const speechBubble = document.getElementById('robot-speech');
            speechBubble.innerText = text;
            speechBubble.style.display = 'block';
            clearTimeout(roastTimeout);
            roastTimeout = setTimeout(() => {
                speechBubble.style.display = 'none';
            }, 4000);
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestionPool.length) {
                showError();
                return;
            }

            const qData = currentQuestionPool[currentQuestionIndex];
            const questionText = document.getElementById('question-text');
            const optionsGrid = document.getElementById('options-grid');
            const nextBtn = document.getElementById('next-btn');

            questionText.innerText = `Question ${currentQuestionIndex + 1}: ${qData.q}`;
            optionsGrid.innerHTML = '';
            nextBtn.style.display = 'none';
            currentSelection = null;

            const progressPercent = (currentQuestionIndex / currentQuestionPool.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            const shuffledOpts = qData.opts.sort(() => 0.5 - Math.random());

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                btn.onmouseover = () => {
                    if (Math.random() > 0.6) { 
                        btn.innerText = "Not this one!";
                    }
                };

                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentSelection = opt;
                    document.getElementById('next-btn').style.display = 'inline-block';
                    
                    const randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
                    speak(randomRoast);
                };
                optionsGrid.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (currentSelection) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function showError() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('error-screen').style.display = 'block';
            speak("Verdict reached. You are definitely human.");
            // Stop the robot from moving at the end
            clearTimeout(moveTimeout);
        }

        initGame();
    </script>
</body>
</html>
