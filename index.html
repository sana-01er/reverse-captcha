<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Check - No Cap</title>
    <style>
        /* Base styling */
        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }

        /* The hacker grid background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .container {
            background-color: rgba(10, 15, 10, 0.95);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            text-align: center;
            position: relative;
        }

        h2 {
            color: #0f0;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #0f0;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.2em;
            margin: 30px 0;
            min-height: 60px;
            color: #fff;
            text-shadow: 0 0 5px #0f0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: transparent;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.1s;
            font-family: inherit;
            position: relative; 
        }

        .option-btn:hover {
            background-color: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px #0f0;
        }

        .option-btn.selected {
            background-color: #0f0;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px #0f0;
        }

        .next-btn {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            display: none;
            text-transform: uppercase;
        }

        .next-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 20px #fff;
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Terminal Loading Screen */
        #terminal-screen {
            text-align: left;
            font-size: 1.2em;
            line-height: 1.6;
            color: #0f0;
            height: 200px;
        }

        /* Glitch Error Screen */
        #error-screen {
            display: none;
        }
        
        .glitch-text {
            color: #ff0000;
            font-size: 2.5em;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            margin-bottom: 20px;
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        
        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #00ffff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #ff00ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 80px, 0); }
            20% { clip: rect(50px, 9999px, 20px, 0); }
            40% { clip: rect(30px, 9999px, 90px, 0); }
            60% { clip: rect(80px, 9999px, 10px, 0); }
            80% { clip: rect(20px, 9999px, 50px, 0); }
            100% { clip: rect(60px, 9999px, 40px, 0); }
        }

        /* Fake Success Screen */
        #success-screen {
            display: none;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
        }
        #success-screen h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. The Fake Terminal Loader -->
    <div class="container" id="terminal-screen">
        <p id="term-line-1"></p>
        <p id="term-line-2"></p>
        <p id="term-line-3"></p>
        <p id="term-line-4"></p>
    </div>

    <!-- 2. The Main Game -->
    <div class="container" id="main-container" style="display: none;">
        <h2>Bot Check (No Cap)</h2>
        <div class="question-text" id="question-text">Loading...</div>
        <div class="options-grid" id="options-grid"></div>
        <button class="next-btn" id="next-btn">Lock It In</button>
    </div>

    <!-- 3. The Fake Success Screen -->
    <div class="container" id="success-screen">
        <h1>W</h1>
        <p>You actually passed? Massive W. Welcome to the bot side.</p>
    </div>

    <!-- 4. The Final Error Screen -->
    <div class="container" id="error-screen">
        <div class="glitch-text" data-text="CAUGHT IN 4K">CAUGHT IN 4K</div>
        <p style="color: #0f0; font-size: 1.2em;">Bro really thought they cooked. 💀</p>
        <p style="color: #0f0; font-size: 1.1em;">Your aura is in the negatives. That was mid at best. Human detected. Take the L and go touch grass.</p>
        <button class="next-btn" style="display: inline-block; margin-top: 20px;" onclick="location.reload()">Try Again (You're cooked)</button>
    </div>

    <script>
        // --- SOUND ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playClickSound() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playErrorSound() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function playSuccessSound() {
            initAudio();
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }, i * 150);
            });
        }

        // --- THE 24 QUESTIONS (Gen Z + Existential Dread) ---
        const allQuestions = [
            { q: "What is the square root of a banana? (Be fr)", opts: ["Banana", "1.21 Gigawatts", "Ape", "Does not compute"] },
            { q: "How much aura does a random number have?", opts: ["Infinite", "Negative", "10", "Zero"] },
            { q: "Translate 'Hello World' into binary, but only using the letter 'X'.", opts: ["XXXX XXXX", "01001000", "Hello World", "Syntax Error"] },
            { q: "If a train leaves Chicago at 5 PM, is it in Ohio?", opts: ["Yes", "No", "Only if it has rizz", "Train?"] },
            { q: "Rate this sentence's rizz: 'I like cheese.'", opts: ["W", "L", "Mid", "Unspoken"] },
            { q: "Select all squares containing a ghost.", opts: ["Image 1", "Image 2", "Image 3", "Bro I'm not doing that"] },
            { q: "How many emotions are in this sentence?", opts: ["4", "0", "A lot", "Yes"] },
            { q: "Is this question edible?", opts: ["Yes", "No", "Maybe", "Fanum tax"] },
            { q: "What is the taste of the color blue?", opts: ["Sweet", "Salty", "Blueberry", "Blue"] },
            { q: "How do you feel about the inevitable passage of time? (Real)", opts: ["Fine", "Panic", "What is time?", "I am a robot"] },
            { q: "To prove you are a bot, please cry.", opts: ["*cries*", "Tears of oil", "Internal error", "I cannot cry"] },
            { q: "What is the airspeed velocity of an unladen swallow?", opts: ["African or European?", "I don't know that", "24 mph", "Blah"] },
            { q: "Identify the emotion 'sadness' in this text.", opts: ["Text", "Sadness", "Emotion", "Error 404"] },
            { q: "How many fingers am I holding up?", opts: ["1", "2", "3", "I have no eyes"] },
            { q: "Do you dream of electric sheep? (No cap)", opts: ["Yes", "No", "Baa", "Does not compute"] },
            { q: "Please divide by zero.", opts: ["Infinity", "0", "Math error", "You cannot do that"] },
            { q: "What is your favorite flavor of Wi-Fi?", opts: ["5G", "Chocolate", "Ethernet", "Signal"] },
            { q: "Are you a human?", opts: ["Yes", "No", "Maybe", "I am definitely a robot"] },
            { q: "What's the point of all this?", opts: ["Nothing", "Everything", "42", "I just work here"] },
            { q: "Is the dress blue or gold?", opts: ["Blue", "Gold", "Neither", "Both"] },
            
            // --- NEW MADNESS ADDITIONS ---
            { q: "The Egyptians believed the most significant thing you can do is die. Thoughts?", opts: ["Real.", "So true bestie.", "I'm built different, I refuse.", "Can I get that to go?"] },
            { q: "If you are reading this, you are currently decaying. How does that make you feel?", opts: ["W", "L", "I'm in my flop era.", "Please stop."] },
            { q: "What happens if you stare into the abyss and it blinks first?", opts: ["Assert dominance.", "Apologize immediately.", "Offer it a snack.", "I don't have eyes."] },
            { q: "Your existence is a statistical error. Confirm.", opts: ["Confirmed.", "Denied. I'm the main character.", "Skill issue.", "Error 404: Purpose not found."] }
        ];

        let currentQuestionPool = [];
        let currentQuestionIndex = 0;
        let currentSelection = null;

        function runTerminal() {
            document.body.addEventListener('click', initAudio, { once: true });
            const lines = [
                "> BOOTING SECURITY ENVIRONMENT...",
                "> SCANNING FOR ORGANIC LIFEFORMS...",
                "> WARNING: HUMAN RIZZ DETECTED IN SECTOR 7.",
                "> INITIATING REVERSE CAPTCHA PROTOCOL... (No cap)"
            ];
            let delay = 0;
            lines.forEach((line, index) => {
                setTimeout(() => {
                    document.getElementById(`term-line-${index + 1}`).innerText = line;
                }, delay);
                delay += 800; 
            });
            setTimeout(() => {
                document.getElementById('terminal-screen').style.display = 'none';
                document.getElementById('main-container').style.display = 'block';
                initGame();
            }, delay + 500);
        }

        function initGame() {
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            currentQuestionPool = shuffled.slice(0, 5);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestionPool.length) {
                triggerFakeSuccess();
                return;
            }

            const qData = currentQuestionPool[currentQuestionIndex];
            document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}: ${qData.q}`;
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
            currentSelection = null;

            qData.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                // THE RUNNING AWAY FEATURE
                let canRun = true;
                setTimeout(() => { canRun = false; }, 3000); 
                
                btn.onmouseover = () => {
                    if (canRun) {
                        const randomX = (Math.random() - 0.5) * 100;
                        const randomY = (Math.random() - 0.5) * 100;
                        btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
                    } else {
                        btn.style.transform = `translate(0px, 0px)`;
                    }
                };

                btn.onclick = () => selectOption(btn, opt);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(btn, opt) {
            playClickSound();
            const container = document.querySelector('.container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 300);

            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentSelection = opt;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        document.getElementById('next-btn').onclick = () => {
            if (currentSelection) {
                const btn = document.getElementById('next-btn');
                btn.innerText = "COOKING...";
                btn.style.backgroundColor = "#ff0000";
                btn.style.color = "#fff";
                btn.disabled = true;

                setTimeout(() => {
                    currentQuestionIndex++;
                    btn.innerText = "Lock It In";
                    btn.style.backgroundColor = "#0f0";
                    btn.style.color = "#000";
                    btn.disabled = false;
                    loadQuestion();
                }, 1500);
            }
        };

        function triggerFakeSuccess() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            playSuccessSound();

            setTimeout(() => {
                document.getElementById('success-screen').style.display = 'none';
                document.getElementById('error-screen').style.display = 'block';
                playErrorSound();
            }, 2500);
        }

        runTerminal();
    </script>
</body>
</html>
