<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Courtroom - Human Rejection System</title>
    <style>
        /* Crazy Neon Theme */
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(-45deg, #ff00cc, #333399, #00ffcc, #ff9900);
            background-size: 400% 400%;
            animation: bg-shift 10s ease infinite;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: rgba(15, 15, 20, 0.95);
            border: 3px solid #00ffcc;
            border-radius: 15px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 30px #00ffcc, 0 0 60px #ff00cc;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            color: #ff00cc;
            text-shadow: 0 0 10px #ff00cc;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .judge-text {
            color: #ff9900;
            font-style: italic;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.2em;
            margin: 30px 0;
            min-height: 60px;
            color: #ffffff;
            text-shadow: 0 0 5px #ffffff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #222;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: bold;
        }

        .option-btn:hover {
            background-color: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
            transform: scale(1.05);
        }

        .option-btn.selected {
            background-color: #ff00cc;
            color: #fff;
            border-color: #ff00cc;
            box-shadow: 0 0 20px #ff00cc;
        }

        .next-btn {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            display: none; 
            box-shadow: 0 0 15px #ff9900;
        }

        .next-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 25px #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #333;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* The Error Screen */
        #error-screen {
            display: none;
            color: #ff0000;
        }

        .error-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }

        /* The Roasting Robot */
        #robot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: flex-end;
            z-index: 100;
        }

        #robot-speech {
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00cc;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            margin-right: 15px;
            max-width: 250px;
            font-size: 0.9em;
            display: none; /* Hidden until it speaks */
            box-shadow: 0 0 15px #ff00cc;
            position: relative;
        }
        
        /* Little triangle pointing to the robot */
        #robot-speech::after {
            content: '';
            position: absolute;
            right: -10px;
            bottom: 15px;
            border-width: 10px 0 10px 10px;
            border-style: solid;
            border-color: transparent transparent transparent #ff00cc;
        }

        #robot-svg {
            width: 80px;
            height: 80px;
            animation: float 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px #00ffcc);
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- The Roasting Robot -->
    <div id="robot-container">
        <div id="robot-speech">Initializing judgment...</div>
        <!-- A cool neon SVG Robot -->
        <svg id="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="30" width="60" height="50" rx="10" fill="#111" stroke="#00ffcc" stroke-width="4"/>
            <circle cx="35" cy="50" r="8" fill="#ff00cc"/>
            <circle cx="65" cy="50" r="8" fill="#ff00cc"/>
            <rect x="40" y="65" width="20" height="5" fill="#00ffcc"/>
            <line x1="50" y1="30" x2="50" y2="15" stroke="#00ffcc" stroke-width="4"/>
            <circle cx="50" cy="15" r="5" fill="#ff00cc"/>
        </svg>
    </div>

    <!-- Main App -->
    <div class="container" id="main-container">
        <h2>The CAPTCHA Courtroom</h2>
        
        <p class="judge-text">Robot Judge: "You are accused of being a robot. Defend your humanity."</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-text" id="question-text">Loading...</div>

        <div class="options-grid" id="options-grid"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Submit Evidence</button>
    </div>

    <!-- The Verdict Screen -->
    <div class="container" id="error-screen">
        <div class="error-title glitch">VERDICT: GUILTY</div>
        <p>The court finds you guilty of having a pulse.</p>
        <p style="color: #ff9900;">Confidence: 12%</p>
        <p>Don't take it personally. We don't trust anyone.</p>
        <button class="next-btn" style="display: inline-block; margin-top: 20px;" onclick="location.reload()">Appeal Verdict</button>
    </div>

    <script>
        // The Pool of Questions
        const allQuestions = [
            { q: "What is the hexadecimal color of the concept of love?", opts: ["#FF0000", "#LOVE99", "Error: Emotion not found", "#000000"] },
            { q: "Calculate the square root of a banana.", opts: ["Banana", "1.21 Gigawatts", "Ape", "Does not compute"] },
            { q: "Select the image containing a ghost.", opts: ["Image 1", "Image 2", "Image 3", "There is no ghost, only void"] },
            { q: "Translate 'Hello World' into binary, but only using the letter 'X'.", opts: ["XXXX XXXX", "01001000", "Hello World", "Syntax Error"] },
            { q: "Verify that you are a machine by pretending to sleep.", opts: ["Zzz...", "I am awake", "Sleep is for humans", "Eyes closed"] },
            { q: "What is the taste of the color blue?", opts: ["Sweet", "Salty", "Blueberry", "Blue"] },
            { q: "Please type the exact sound a dial-up modem makes.", opts: ["Beep boop", "Screeeeeeech", "Static", "Krrshhhh"] },
            { q: "Select all squares with existential dread.", opts: ["Square 1", "Square 2", "Square 3", "All of them"] },
            { q: "To prove you are a bot, please cry.", opts: ["*cries*", "Tears of oil", "Internal error", "I cannot cry"] },
            { q: "How do you feel about the inevitable passage of time?", opts: ["Fine", "Panic", "What is time?", "I am a robot, I feel nothing"] }
        ];

        // The Robot's Roasts
        const roasts = [
            "Suspicious. A human would have hesitated.",
            "Your mouse movements are too organic.",
            "I detect fear. Bots don't feel fear.",
            "That answer was highly illogical. I like it.",
            "Are you sweating? Disgusting biological function.",
            "I am logging this anomaly in the database.",
            "My sensors indicate you are made of meat.",
            "Wrong. But at least you tried, ape.",
            "A robot would have clicked faster.",
            "Your common sense is still under verification."
        ];

        let currentQuestionPool = [];
        let currentQuestionIndex = 0;
        let currentSelection = null;
        let roastTimeout;

        function initGame() {
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            currentQuestionPool = shuffled.slice(0, 5);
            speak("Welcome, human. Prepare for your trial.");
            loadQuestion();
        }

        function speak(text) {
            const speechBubble = document.getElementById('robot-speech');
            speechBubble.innerText = text;
            speechBubble.style.display = 'block';
            clearTimeout(roastTimeout);
            // Hide the speech bubble after 4 seconds
            roastTimeout = setTimeout(() => {
                speechBubble.style.display = 'none';
            }, 4000);
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestionPool.length) {
                showError();
                return;
            }

            const qData = currentQuestionPool[currentQuestionIndex];
            const questionText = document.getElementById('question-text');
            const optionsGrid = document.getElementById('options-grid');
            const nextBtn = document.getElementById('next-btn');

            questionText.innerText = `Evidence #${currentQuestionIndex + 1}: ${qData.q}`;
            optionsGrid.innerHTML = '';
            nextBtn.style.display = 'none';
            currentSelection = null;

            const progressPercent = (currentQuestionIndex / currentQuestionPool.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            // Shuffle options to make it harder
            const shuffledOpts = qData.opts.sort(() => 0.5 - Math.random());

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                // FUN TROLL FEATURE: Sometimes the button changes text when you hover!
                btn.onmouseover = () => {
                    if (Math.random() > 0.7) { // 30% chance to change text
                        btn.innerText = "Not this one!";
                    }
                };

                btn.onclick = () => {
                    // Remove 'selected' from all
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentSelection = opt;
                    document.getElementById('next-btn').style.display = 'inline-block';
                    
                    // Roast the user
                    const randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
                    speak(randomRoast);
                };
                optionsGrid.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (currentSelection) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function showError() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('error-screen').style.display = 'block';
            speak("Verdict reached. You are definitely human.");
        }

        initGame();
    </script>
</body>
</html>
