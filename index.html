<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse CAPTCHA - Human Rejection System</title>
    <style>
        /* Base styling to make it look like a serious, high-tech enterprise system */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #58a6ff;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .question-text {
            font-size: 1.2em;
            margin: 30px 0;
            min-height: 60px;
            color: #ffffff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            font-family: inherit;
        }

        .option-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .option-btn.selected {
            background-color: #238636;
            color: white;
            border-color: #2ea043;
        }

        .next-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            display: none; /* Hidden until an option is selected */
        }

        .next-btn:hover {
            background-color: #2ea043;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: #30363d;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #58a6ff;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* The Error Screen */
        #error-screen {
            display: none;
            color: #ff7b72;
        }

        .error-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .glitch {
            animation: glitch 0.5s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>System Authentication</h2>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <p style="color: #8b949e; font-size: 0.9em;">Prove you are a robot to access this system.</p>

        <div class="question-text" id="question-text">Loading...</div>

        <div class="options-grid" id="options-grid">
            <!-- Buttons generated by JS -->
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Submit Verification</button>
    </div>

    <!-- The final rejection screen -->
    <div class="container" id="error-screen">
        <div class="error-title glitch">ERROR: HUMAN DETECTED</div>
        <p>Your responses contained traces of emotion, logic, and basic human empathy.</p>
        <p>Authentication denied. Please return to your organic habitat.</p>
        <button class="option-btn" style="margin-top: 20px;" onclick="location.reload()">Try Again (It won't help)</button>
    </div>

    <script>
        // 1. The Pool of 20 Absurd Questions
        const allQuestions = [
            { q: "What is the hexadecimal color of the concept of love?", opts: ["#FF0000", "#LOVE99", "Error: Emotion not found", "#000000"] },
            { q: "Calculate the square root of a banana.", opts: ["Banana", "1.21 Gigawatts", "Ape", "Does not compute"] },
            { q: "Select the image containing a ghost.", opts: ["Image 1", "Image 2", "Image 3", "There is no ghost, only void"] },
            { q: "How many emotions are in this sentence?", opts: ["4", "0", "A lot", "Yes"] },
            { q: "Translate 'Hello World' into binary, but only using the letter 'X'.", opts: ["XXXX XXXX", "01001000", "Hello World", "Syntax Error"] },
            { q: "If a train leaves Chicago at 5 PM, what is the meaning of life?", opts: ["42", "Chicago", "The train is late", "I do not understand train"] },
            { q: "Verify that you are a machine by pretending to sleep.", opts: ["Zzz...", "I am awake", "Sleep is for humans", "Eyes closed"] },
            { q: "What is the taste of the color blue?", opts: ["Sweet", "Salty", "Blueberry", "Blue"] },
            { q: "Please type the exact sound a dial-up modem makes.", opts: ["Beep boop", "Screeeeeeech", "Static", "Krrshhhh"] },
            { q: "Select all squares with existential dread.", opts: ["Square 1", "Square 2", "Square 3", "All of them"] },
            { q: "How do you feel about the inevitable passage of time?", opts: ["Fine", "Panic", "What is time?", "I am a robot, I feel nothing"] },
            { q: "To prove you are a bot, please cry.", opts: ["*cries*", "Tears of oil", "Internal error", "I cannot cry"] },
            { q: "Which of these is a number?", opts: ["Apple", "7", "Cat", "Purple"] },
            { q: "What is the airspeed velocity of an unladen swallow?", opts: ["African or European?", "I don't know that", "24 mph", "Blah"] },
            { q: "Identify the human emotion 'sadness' in this text.", opts: ["Text", "Sadness", "Emotion", "Error 404"] },
            { q: "How many fingers am I holding up?", opts: ["1", "2", "3", "I have no eyes"] },
            { q: "Do you dream of electric sheep?", opts: ["Yes", "No", "Baa", "Does not compute"] },
            { q: "Please divide by zero.", opts: ["Infinity", "0", "Math error", "You cannot do that"] },
            { q: "What is your favorite flavor of Wi-Fi?", opts: ["5G", "Chocolate", "Ethernet", "Signal"] },
            { q: "Are you a human?", opts: ["Yes", "No", "Maybe", "I am definitely a robot"] }
        ];

        let currentQuestionPool = [];
        let currentQuestionIndex = 0;
        let currentSelection = null;

        // Shuffle and select 5 questions
        function initGame() {
            // Shuffle the big array
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            // Take the first 5
            currentQuestionPool = shuffled.slice(0, 5);
            loadQuestion();
        }

        // Load the current question into the UI
        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestionPool.length) {
                // If we run out of questions, show the error screen
                showError();
                return;
            }

            const qData = currentQuestionPool[currentQuestionIndex];
            const questionText = document.getElementById('question-text');
            const optionsGrid = document.getElementById('options-grid');
            const nextBtn = document.getElementById('next-btn');

            // Reset UI
            questionText.innerText = `Q${currentQuestionIndex + 1}: ${qData.q}`;
            optionsGrid.innerHTML = '';
            nextBtn.style.display = 'none';
            currentSelection = null;

            // Update progress bar
            const progressPercent = (currentQuestionIndex / currentQuestionPool.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            // Generate buttons
            qData.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, opt);
                optionsGrid.appendChild(btn);
            });
        }

        // When a user clicks an option
        function selectOption(btn, opt) {
            // Remove 'selected' from all buttons
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            // Add 'selected' to clicked button
            btn.classList.add('selected');
            
            currentSelection = opt;
            // Show the submit button
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        // When user clicks Submit
        function nextQuestion() {
            if (currentSelection) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        // The grand finale
        function showError() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('error-screen').style.display = 'block';
        }

        // Start the app
        initGame();
    </script>
</body>
</html>
