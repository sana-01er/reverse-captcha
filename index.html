<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Verification Protocol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&family=Permanent+Marker&display=swap');

        /* Swirling animated background (No checkers!) */
        body {
            background: linear-gradient(-45deg, #111111, #2b0f3a, #ff0000, #e6ff00);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: rgba(17, 17, 17, 0.95);
            border: 6px solid #ff0000;
            padding: 30px;
            width: 80%;
            max-width: 650px;
            box-shadow: 12px 12px 0px #e6ff00;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            font-family: 'Black Ops One', cursive;
            color: #000;
            background-color: #e6ff00;
            display: inline-block;
            padding: 10px 20px;
            border: 4px solid #ff0000;
            margin-top: -55px;
            margin-bottom: 20px;
            font-size: 2em;
            box-shadow: 5px 5px 0px #2b0f3a;
            text-transform: uppercase;
        }

        .judge-text {
            font-family: 'Permanent Marker', cursive;
            color: #e6ff00;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin: 25px 0;
            min-height: 60px;
            color: #fff;
            background-color: #2b0f3a;
            padding: 15px;
            border: 3px dashed #e6ff00;
            position: relative;
            z-index: 20;
        }

        /* The area where buttons live before they escape */
        .options-container {
            height: 200px; 
            margin-bottom: 20px;
            position: relative;
            z-index: 20;
        }

        /* The Buttons - Fixed so they can run anywhere */
        .option-btn {
            position: fixed;
            background-color: #111;
            color: #fff;
            border: 3px solid #e6ff00;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 4px 4px 0px #ff0000;
            /* NO TRANSITION - We want them to teleport instantly! */
        }

        .option-btn:hover {
            background-color: #ff0000;
        }

        .option-btn.selected {
            background-color: #e6ff00;
            color: #000;
            border-color: #ff0000;
            /* Once clicked, it stops running away */
            pointer-events: none; 
        }

        .next-btn {
            background-color: #ff0000;
            color: #fff;
            border: 4px solid #e6ff00;
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: 'Bungee', cursive;
            cursor: pointer;
            display: none; 
            box-shadow: 6px 6px 0px #000;
            transition: all 0.1s;
        }

        .next-btn:hover {
            background-color: #e6ff00;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #ff0000;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background-color: #333;
            border: 3px solid #e6ff00;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px #000;
        }

        .progress-fill {
            height: 100%;
            background-color: #ff0000;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Error Screen */
        #error-screen {
            display: none;
            color: #fff;
        }

        .error-title {
            font-family: 'Black Ops One', cursive;
            font-size: 2.5em;
            color: #ff0000;
            text-shadow: 3px 3px 0px #e6ff00;
            margin-bottom: 20px;
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-4px, 4px) }
            40% { transform: translate(-4px, -4px) }
            60% { transform: translate(4px, 4px) }
            80% { transform: translate(4px, -4px) }
            100% { transform: translate(0) }
        }

        /* The Cyber-Eye Robot (Locked to the right side) */
        #robot-container {
            position: absolute;
            display: flex;
            align-items: center;
            z-index: 100;
            transition: all 2s ease-in-out; 
            top: 10%;
            right: 2%; /* Keeps it away from the center text */
        }

        #robot-speech {
            background-color: #e6ff00;
            border: 4px solid #ff0000;
            color: #000;
            padding: 15px;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.1em;
            margin-right: 15px;
            max-width: 250px;
            display: none; 
            box-shadow: 6px 6px 0px #2b0f3a;
            position: relative;
        }
        
        #robot-speech::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 10px 0 10px 15px;
            border-style: solid;
            border-color: transparent transparent transparent #ff0000;
        }

        #robot-svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(5px 5px 0px #ff0000);
            animation: hover 1.5s infinite alternate ease-in-out;
        }

        @keyframes hover {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <!-- The Robot -->
    <div id="robot-container">
        <div id="robot-speech">Initializing...</div>
        <svg id="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#111" stroke="#e6ff00" stroke-width="4"/>
            <line x1="50" y1="5" x2="50" y2="25" stroke="#ff0000" stroke-width="2"/>
            <line x1="95" y1="75" x2="75" y2="65" stroke="#ff0000" stroke-width="2"/>
            <line x1="5" y1="75" x2="25" y2="65" stroke="#ff0000" stroke-width="2"/>
            <circle cx="50" cy="50" r="25" fill="#2b0f3a" stroke="#e6ff00" stroke-width="3"/>
            <circle cx="50" cy="50" r="15" fill="#ff0000"/>
            <circle cx="50" cy="50" r="5" fill="#fff"/>
            <rect x="20" y="50" width="10" height="3" fill="#e6ff00"/>
            <rect x="70" y="40" width="15" height="2" fill="#ff0000"/>
        </svg>
    </div>

    <!-- Main App -->
    <div class="container" id="main-container">
        <h2>Human Verification Protocol</h2>
        <p class="judge-text">"System detects organic matter. Prove you are a machine."</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-text" id="question-text">Loading...</div>

        <!-- The invisible box where buttons start out -->
        <div class="options-container" id="options-container"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Submit</button>
    </div>

    <!-- Verdict Screen -->
    <div class="container" id="error-screen">
        <div class="error-title glitch">HUMAN DETECTED</div>
        <p style="font-weight:bold; font-size:1.2em; color: #e6ff00;">Verdict: Guilty of having a pulse.</p>
        <p>Confidence: 0.01%</p>
        <p>"Your attempts to mimic a robot were highly illogical."</p>
        <button class="next-btn" style="display: inline-block; margin-top: 20px;" onclick="location.reload()">Reboot Trial</button>
    </div>

    <script>
        // (Questions and Roasts remain the same)
        const allQuestions = [
            { q: "Calculate the square root of a banana.", opts: ["Banana", "1.21 Gigawatts", "Ape", "Does not compute"] },
            { q: "What is the hexadecimal color of the concept of love?", opts: ["#FF0000", "#LOVE99", "Error: Emotion not found", "#000000"] },
            { q: "Select the image containing a ghost.", opts: ["Image 1", "Image 2", "Image 3", "There is no ghost, only void"] },
            { q: "Translate 'Hello World' into binary, but only using the letter 'X'.", opts: ["XXXX XXXX", "01001000", "Hello World", "Syntax Error"] },
            { q: "Verify that you are a machine by pretending to sleep.", opts: ["Zzz...", "I am awake", "Sleep is for humans", "Eyes closed"] },
            { q: "What is the taste of the color blue?", opts: ["Sweet", "Salty", "Blueberry", "Blue"] },
            { q: "Please type the exact sound a dial-up modem makes.", opts: ["Beep boop", "Screeeeeeech", "Static", "Krrshhhh"] },
            { q: "Select all squares with existential dread.", opts: ["Square 1", "Square 2", "Square 3", "All of them"] },
            { q: "To prove you are a bot, please cry.", opts: ["*cries*", "Tears of oil", "Internal error", "I cannot cry"] },
            { q: "How do you feel about the inevitable passage of time?", opts: ["Fine", "Panic", "What is time?", "I am a robot, I feel nothing"] }
        ];

        const roasts = [
            "We wanna give you a chance. I see... you are struggling.",
            "Suspicious. A human would have hesitated.",
            "I detect fear. Bots don't feel fear.",
            "Are you sweating? Disgusting biological function.",
            "My sensors indicate you are made of meat.",
            "Wrong. But at least you tried, ape.",
            "We wanna give you a chance. I see... you are definitely human.",
            "Your common sense is still under verification."
        ];

        let currentQuestionPool = [];
        let currentQuestionIndex = 0;
        let currentSelection = null;
        let roastTimeout;
        let moveTimeout;

        function initGame() {
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            currentQuestionPool = shuffled.slice(0, 5);
            speak("Welcome. Let the trial begin.");
            moveRobot(); 
            loadQuestion();
        }

        // --- THE FAST DODGE LOGIC ---
        function dodgeButton(btn) {
            // Generate random coordinates across the WHOLE SCREEN
            const maxX = window.innerWidth - 200; // Keep it from going off the right edge
            const maxY = window.innerHeight - 100; // Keep it from going off the bottom edge

            // Make sure it doesn't hide behind the main container
            const minX = 50;
            const minY = 50;

            const newX = Math.floor(Math.random() * (maxX - minX) + minX);
            const newY = Math.floor(Math.random() * (maxY - minY) + minY);

            // Teleport instantly
            btn.style.left = `${newX}px`;
            btn.style.top = `${newY}px`;
        }

        function moveRobot() {
            const robot = document.getElementById('robot-container');
            // Keep it on the right half of the screen
            const randomTop = Math.floor(Math.random() * 70) + 10; 
            const randomRight = Math.floor(Math.random() * 30) + 2; 
            
            robot.style.top = `${randomTop}%`;
            robot.style.right = `${randomRight}%`;

            const nextMove = Math.random() * 3000 + 2000;
            moveTimeout = setTimeout(moveRobot, nextMove);
        }

        function speak(text) {
            const speechBubble = document.getElementById('robot-speech');
            speechBubble.innerText = text;
            speechBubble.style.display = 'block';
            clearTimeout(roastTimeout);
            roastTimeout = setTimeout(() => {
                speechBubble.style.display = 'none';
            }, 4000);
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestionPool.length) {
                showError();
                return;
            }

            const qData = currentQuestionPool[currentQuestionIndex];
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');

            questionText.innerText = `Question ${currentQuestionIndex + 1}: ${qData.q}`;
            
            // Clear old buttons
            optionsContainer.innerHTML = '';
            document.querySelectorAll('.option-btn').forEach(b => b.remove());

            nextBtn.style.display = 'none';
            currentSelection = null;

            const progressPercent = (currentQuestionIndex / currentQuestionPool.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            const shuffledOpts = qData.opts.sort(() => 0.5 - Math.random());

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                // Place button initially inside the main container
                const rect = optionsContainer.getBoundingClientRect();
                btn.style.left = `${rect.left + (Math.random() * (rect.width - 150))}px`;
                btn.style.top = `${rect.top + (Math.random() * 100) + 20}px`;

                // THE DODGE: When mouse touches it, jump away instantly
                btn.addEventListener('mouseenter', () => {
                    // 85% chance to dodge so the user can eventually click it
                    if (Math.random() > 0.15 && !btn.classList.contains('selected')) {
                        dodgeButton(btn);
                    }
                });

                btn.onclick = () => {
                    // Freeze the clicked button
                    btn.classList.add('selected');
                    currentSelection = opt;
                    document.getElementById('next-btn').style.display = 'inline-block';
                    
                    // Roast the user
                    const randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
                    speak(randomRoast);
                };
                
                document.body.appendChild(btn); // Append to body so it can float anywhere
            });
        }

        function nextQuestion() {
            if (currentSelection) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function showError() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('error-screen').style.display = 'block';
            speak("Verdict reached. You are definitely human.");
            clearTimeout(moveTimeout);
            // Hide any remaining buttons
            document.querySelectorAll('.option-btn').forEach(b => b.style.display = 'none');
        }

        initGame();
    </script>
</body>
</html>
